<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicTech — Daily Planner</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <span>Loading Planner...</span>
</div>

<div class="app-layout" id="app" style="display:none">

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="Close menu">×</button>
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-box">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div>
          <div class="brand-name">MagicTech</div>
          <div class="brand-sub">Daily Planner</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Planner</div>
      <a class="nav-item active" id="nav-summary">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Daily Summary
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" onclick="showChangePassword()">
        <div class="user-avatar" id="sidebar-avatar" style="background:var(--red-dark)">P</div>
        <div>
          <div class="user-name" id="sidebar-name">Planner</div>
          <div class="user-role">Planner</div>
        </div>
        <svg style="margin-left:auto;opacity:0.5" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M4.93 19.07l1.41-1.41M19.07 19.07l-1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      </div>
      <button onclick="logout()" class="btn btn-secondary" style="width:100%;margin-top:8px;font-size:13px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="page-title">Daily Summary</div>
      </div>
      <div class="topbar-actions">
        <div id="today-display" style="font-size:13px;color:var(--gray-500);font-weight:500"></div>
      </div>
    </div>

    <div class="page-content">

      <!-- ── DATE CONTROLS ── -->
      <div class="card" style="margin-bottom:20px">
        <div class="card-body" style="padding:16px 20px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:200px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <input type="date" id="summary-date" class="form-control" style="max-width:200px;padding:8px 12px">
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-secondary btn-sm" onclick="goToday()">Today</button>
              <button class="btn btn-danger btn-sm" onclick="loadSummary()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Load
              </button>
            </div>
            <div id="summary-stats" style="margin-left:auto;display:flex;gap:16px"></div>
          </div>
        </div>
      </div>

      <!-- ── SUMMARY CONTENT ── -->
      <div id="summary-content">
        <div class="text-center text-muted" style="padding:60px 20px">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" stroke-width="1.5" style="margin-bottom:16px">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <p style="font-size:15px;color:var(--gray-500)">Select a date and click <strong>Load</strong> to see today's projects</p>
        </div>
      </div>

    </div><!-- /page-content -->
  </main>
</div><!-- /app-layout -->

<!-- ═══ CHANGE PASSWORD MODAL ═══ -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2>Change Password</h2>
      <button class="modal-close" onclick="closeModal('pw-modal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>Current Password</label><input type="password" id="pw-current"></div>
      <div class="form-group"><label>New Password</label><input type="password" id="pw-new"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" id="pw-confirm"></div>
      <div id="pw-alert"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('pw-modal')">Cancel</button>
      <button class="btn btn-danger" onclick="changePassword()">Update Password</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<footer class="espark-footer">
  <span>Created by <span class="espark-brand">eSpark</span> Developers</span>
</footer>

<script src="/js/planner.js"></script>
</body>
</html>
