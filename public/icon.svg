<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A0001A"/>
      <stop offset="100%" stop-color="#5C0000"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <line x1="102" y1="41" x2="102" y2="471" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="205" y1="41" x2="205" y2="471" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="307" y1="41" x2="307" y2="471" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="410" y1="41" x2="410" y2="471" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="41" y1="102" x2="471" y2="102" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="41" y1="205" x2="471" y2="205" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="41" y1="307" x2="471" y2="307" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="41" y1="410" x2="471" y2="410" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <!-- MT text -->
  <text x="256" y="242"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="215"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.95">MT</text>
  <!-- "Projects" sub-label -->
  <text x="256" y="390"
    font-family="Arial, sans-serif"
    font-weight="600"
    font-size="52"
    fill="white"
    text-anchor="middle"
    opacity="0.75">Projects</text>
  <!-- Red accent bar -->
  <rect x="130" y="430" width="252" height="13" rx="6" fill="#E74C3C"/>
</svg>
