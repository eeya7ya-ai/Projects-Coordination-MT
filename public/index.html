<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicTech Projects Coordination — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/company-logo.jpg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MagicTech">
</head>
<body>
<div class="login-page">
  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <div class="login-card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button id="lang-toggle-btn" onclick="toggleLanguage()" title="Toggle language / تبديل اللغة">عربي</button>
    </div>
    <div class="login-logo">
      <div class="logo-icon">
        <img src="/company-logo.jpg" alt="MagicTech Logo">
      </div>
      <h1>MagicTech</h1>
      <p data-i18n="login.title">Projects Coordination Platform</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" data-i18n="label.username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="label.password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        <span data-i18n="btn.sign_in">Sign In</span>
      </button>
    </form>

  </div>
</div>

<!-- PWA Install Banner (Android/Chrome) -->
<div id="pwa-banner" class="pwa-install-banner" style="display:none" role="banner" aria-label="Install app">
  <div class="pwa-banner-content">
    <img src="/company-logo.jpg" class="pwa-banner-icon" alt="App Icon">
    <div class="pwa-banner-text">
      <strong>Install MagicTech App</strong>
      <span>Add to home screen for quick access</span>
    </div>
  </div>
  <div class="pwa-banner-actions">
    <button id="pwa-install-btn" class="pwa-install-btn">Install</button>
    <button id="pwa-dismiss-btn" class="pwa-dismiss-btn" aria-label="Dismiss">✕</button>
  </div>
</div>

<!-- PWA iOS Banner -->
<div id="pwa-ios-banner" class="pwa-ios-banner" style="display:none" role="banner">
  <div class="pwa-ios-banner-inner">
    <div class="pwa-ios-steps">
      <strong>📲 Install MagicTech on your iPhone</strong>
      Tap <svg class="ios-share-icon" viewBox="0 0 24 24" fill="none" stroke="#2980B9" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> <strong>Share</strong> then choose <strong>"Add to Home Screen"</strong>
    </div>
    <button id="pwa-ios-dismiss" class="pwa-dismiss-btn" aria-label="Dismiss">✕</button>
  </div>
</div>

<footer class="espark-footer">
  <span>Created by <span class="espark-brand">eSpark</span> Developers</span>
</footer>

<script src="/js/i18n.js"></script>
<script>
// Generate floating particles
const particlesEl = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    width: ${Math.random() * 6 + 2}px;
    height: ${Math.random() * 6 + 2}px;
    animation-duration: ${Math.random() * 15 + 8}s;
    animation-delay: ${Math.random() * 10}s;
    opacity: ${Math.random() * 0.5 + 0.2};
  `;
  particlesEl.appendChild(p);
}

const form = document.getElementById('login-form');
const alertEl = document.getElementById('alert');
const loginBtn = document.getElementById('login-btn');

function showAlert(msg, type = 'error') {
  alertEl.className = `alert alert-${type}`;
  alertEl.textContent = msg;
  alertEl.classList.remove('hidden');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Signing in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Login failed');
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In';
      return;
    }

    localStorage.setItem('elv_token', data.token);
    localStorage.setItem('elv_user', JSON.stringify(data.user));

    showAlert('Login successful! Redirecting...', 'success');
    setTimeout(() => {
      if (data.user.role === 'admin') {
        window.location.href = '/admin';
      } else if (data.user.role === 'planner') {
        window.location.href = '/planner';
      } else if (data.user.role === 'sales' || data.user.role === 'presales') {
        window.location.href = '/sales';
      } else {
        window.location.href = '/dashboard';
      }
    }, 600);
  } catch (err) {
    showAlert('Network error. Please try again.');
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In';
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // ── PWA Install Prompt ──────────────────────────────────────
  (function() {
    // Already running as installed PWA — skip
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
    // Already dismissed this session
    if (sessionStorage.getItem('pwa_dismissed')) return;

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if (isIOS && isSafari) {
      // Show iOS instruction banner after a short delay
      setTimeout(() => {
        const banner = document.getElementById('pwa-ios-banner');
        if (banner) banner.style.display = 'block';
      }, 2500);
      document.getElementById('pwa-ios-dismiss').addEventListener('click', () => {
        document.getElementById('pwa-ios-banner').style.display = 'none';
        sessionStorage.setItem('pwa_dismissed', '1');
      });
      return;
    }

    // Android / Chrome / Edge — intercept beforeinstallprompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        const banner = document.getElementById('pwa-banner');
        if (banner) banner.style.display = 'flex';
      }, 1500);
    });

    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('pwa-banner').style.display = 'none';
      if (outcome === 'accepted') sessionStorage.setItem('pwa_dismissed', '1');
    });

    document.getElementById('pwa-dismiss-btn').addEventListener('click', () => {
      document.getElementById('pwa-banner').style.display = 'none';
      sessionStorage.setItem('pwa_dismissed', '1');
    });

    // Hide if user installs
    window.addEventListener('appinstalled', () => {
      document.getElementById('pwa-banner').style.display = 'none';
    });
  })();
</script>
</body>
</html>
