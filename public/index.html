<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicTech Projects Coordination — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
<div class="login-page">
  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <h1>MagicTech</h1>
      <p>Projects Coordination Platform</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Sign In
      </button>
    </form>

  </div>
</div>

<footer class="espark-footer">
  <span>Created by <span class="espark-brand">eSpark</span> Developers</span>
</footer>

<script>
// Generate floating particles
const particlesEl = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    width: ${Math.random() * 6 + 2}px;
    height: ${Math.random() * 6 + 2}px;
    animation-duration: ${Math.random() * 15 + 8}s;
    animation-delay: ${Math.random() * 10}s;
    opacity: ${Math.random() * 0.5 + 0.2};
  `;
  particlesEl.appendChild(p);
}

const form = document.getElementById('login-form');
const alertEl = document.getElementById('alert');
const loginBtn = document.getElementById('login-btn');

function showAlert(msg, type = 'error') {
  alertEl.className = `alert alert-${type}`;
  alertEl.textContent = msg;
  alertEl.classList.remove('hidden');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Signing in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Login failed');
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In';
      return;
    }

    localStorage.setItem('elv_token', data.token);
    localStorage.setItem('elv_user', JSON.stringify(data.user));

    showAlert('Login successful! Redirecting...', 'success');
    setTimeout(() => {
      if (data.user.role === 'admin') {
        window.location.href = '/admin';
      } else if (data.user.role === 'planner') {
        window.location.href = '/planner';
      } else if (data.user.role === 'sales' || data.user.role === 'presales') {
        window.location.href = '/sales';
      } else {
        window.location.href = '/dashboard';
      }
    }, 600);
  } catch (err) {
    showAlert('Network error. Please try again.');
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In';
  }
});
</script>
</body>
</html>
